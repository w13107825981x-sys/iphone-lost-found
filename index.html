
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机失物找回 - 位置分享</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px 14px;
  background:#f3f6fb;color:#202938;
  font-family:Arial,"Microsoft YaHei",sans-serif
}
.container{max-width:520px;margin:35px auto}
.panel{
  background:#fff;border-radius:16px;
  padding:22px;margin-bottom:16px;
  box-shadow:0 4px 18px #0000000a
}
h2{margin:0 0 12px;font-size:23px}
p{line-height:1.8;color:#687386;font-size:14px}
.notice{
  background:#fff8e8;color:#76551b;
  padding:13px;border-radius:10px;
  font-size:13px;line-height:1.8
}
button{
  width:100%;padding:15px;margin-top:12px;
  border:0;border-radius:10px;
  font-size:16px;font-weight:bold;cursor:pointer
}
#startButton{background:#1677ff;color:white}
#stopButton{background:#fff0f0;color:#c0392b}
button:disabled{opacity:.5;cursor:not-allowed}
.status{
  background:#f5f7fa;padding:14px;
  border-radius:10px;line-height:1.8;
  font-size:14px;overflow-wrap:anywhere
}
.small{font-size:12px;color:#8791a1;line-height:1.7}
</style>
</head>
<body>
<div class="container">

  <div class="panel">
    <h2>手机失物找回</h2>
    <p>如果你捡到了他人的手机，可以通过主动分享当前位置，帮助失主找回手机。</p>

    <div class="notice">
      <strong>位置分享说明</strong><br>
      1. 只有你主动点击开始并允许浏览器定位后，网页才会获取位置。<br>
      2. 开始后，网页每30秒尝试获取并上传一次位置。<br>
      3. 你可以随时点击停止分享。<br>
      4. 上传的位置会提供给失主用于找回手机。<br>
      5. 网页切到后台、锁屏或关闭后，浏览器可能暂停定位，不能保证持续运行。
    </div>

    <button id="startButton" onclick="startSharing()">
      同意并开始位置分享
    </button>

    <button id="stopButton" onclick="stopSharing()" style="display:none">
      停止位置分享
    </button>
  </div>

  <div class="panel">
    <h3>位置分享状态</h3>
    <div id="status" class="status" aria-live="polite">
      尚未开始分享位置。
    </div>
    <p class="small">
      定位间隔：30秒。只有定位成功并上传成功的数据才会保存。
      停止分享后，之前已经上传的记录不会自动删除。
    </p>
  </div>

</div>

<script>
const FUNCTION_URL =
  "https://xsccvztarcmwekuhnwvo.supabase.co/functions/v1/rapid-action";

const SUPABASE_KEY =
  "sb_publishable_5Eo-7HNm1xWLyblogIYgfw_WtzhXHJs";

const INTERVAL_MS = 30 * 1000;

let sharing = false;
let timer = null;
let uploading = false;

const statusBox = document.getElementById("status");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

function setStatus(message) {
  statusBox.textContent = message;
}

function updateButtons() {
  startButton.style.display = sharing ? "none" : "block";
  stopButton.style.display = sharing ? "block" : "none";
}

function stopSharing() {
  sharing = false;

  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }

  updateButtons();
  setStatus("位置分享已停止。不会再主动发起新的定位上传。");
}

function startSharing() {
  if (sharing) return;

  if (!window.isSecureContext) {
    setStatus("当前页面不是安全 HTTPS 环境，请使用 GitHub Pages 的 HTTPS 地址。");
    return;
  }

  if (!navigator.geolocation) {
    setStatus("当前浏览器不支持定位功能。");
    return;
  }

  const confirmed = window.confirm(
    "是否同意向失主分享你当前的位置？\n\n" +
    "开始后网页每30秒尝试定位并上传一次。\n" +
    "你可以随时停止分享。"
  );

  if (!confirmed) {
    setStatus("你没有同意位置分享，定位尚未开始。");
    return;
  }

  sharing = true;
  updateButtons();

  setStatus("正在请求浏览器定位权限……");

  // 立即执行第一次定位
  locateAndUpload();

  // 每30秒尝试一次
  timer = setInterval(() => {
    if (sharing) locateAndUpload();
  }, INTERVAL_MS);
}

function locateAndUpload() {
  if (!sharing || uploading) return;

  uploading = true;
  setStatus("正在获取当前位置……");

  navigator.geolocation.getCurrentPosition(
    async position => {
      if (!sharing) {
        uploading = false;
        return;
      }

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      setStatus(
        "已获取位置，正在上传……\n" +
        "纬度：" + latitude + "\n" +
        "经度：" + longitude + "\n" +
        "精度：" + Math.round(accuracy) + " 米"
      );

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({
            action: "report",
            latitude,
            longitude,
            accuracy,
            consent: true
          })
        });

        const result = await response.json();

        if (!response.ok || result.error) {
          throw new Error(result.error || "上传失败");
        }

        if (sharing) {
          setStatus(
            "位置上传成功。\n" +
            "上传时间：" + new Date().toLocaleString("zh-CN") + "\n" +
            "纬度：" + latitude + "\n" +
            "经度：" + longitude + "\n" +
            "定位精度：" + Math.round(accuracy) + " 米\n\n" +
            "下一次定位将在约30秒后尝试。"
          );
        }

      } catch (error) {
        if (sharing) {
          setStatus("位置获取成功，但上传失败： " + error.message);
        }
      } finally {
        uploading = false;
      }
    },

    error => {
      uploading = false;

      if (!sharing) return;

      let message = "定位失败";

      if (error.code === 1) {
        message = "你拒绝了定位权限，请在浏览器设置中允许定位。";
      } else if (error.code === 2) {
        message = "暂时无法获取位置信息，请检查手机定位服务。";
      } else if (error.code === 3) {
        message = "定位请求超时，下一轮会再次尝试。";
      }

      setStatus(message);
    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}

// 页面关闭或离开时，浏览器会结束网页中的定时任务。
// 这不是后台持续定位功能。
window.addEventListener("pagehide", () => {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
  sharing = false;
});
</script>
</body>
</html>
