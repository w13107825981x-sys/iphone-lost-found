
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机失物找回 - 分享当前位置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f5f8;
      padding: 30px 18px;
      color: #222;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 26px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px #00000012;
    }
    h2 { margin-bottom: 12px; }
    p { color: #666; line-height: 1.7; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      margin-top: 18px;
    }
    button:disabled { opacity: .6; }
    #result {
      margin-top: 20px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.8;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📱 手机失物找回</h2>
    <p>
      如果你捡到了这部手机，愿意帮助失主找回，
      可以主动分享当前位置。点击按钮后，浏览器会请求定位授权。
      只有你同意后，位置才会上传给失主查询。
    </p>

    <button id="shareButton" onclick="getLocation()">
      同意并分享我的当前位置
    </button>

    <div id="result">等待你主动分享位置……</div>
  </div>

  <script>
    const FUNCTION_URL =
      "https://xsccvztarcmwekuhnwvo.supabase.co/functions/v1/rapid-action";

    const SUPABASE_KEY =
      "sb_publishable_5Eo-7HNm1xWLyblogIYgfw_WtzhXHJs";

    async function getLocation() {
      const result = document.getElementById("result");
      const button = document.getElementById("shareButton");

      if (!window.isSecureContext) {
        result.textContent = "当前网页不是安全连接，请使用 HTTPS 地址打开。";
        return;
      }

      if (!navigator.geolocation) {
        result.textContent = "当前浏览器不支持定位功能。";
        return;
      }

      button.disabled = true;
      result.textContent = "正在请求定位，请允许浏览器获取位置……";

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          // 先显示坐标，区分定位问题和上传问题
          result.textContent =
            "定位获取成功！\n" +
            "纬度：" + lat + "\n" +
            "经度：" + lng + "\n" +
            "精度：" + Math.round(accuracy) + " 米\n" +
            "正在上传位置……";

          try {
            const response = await fetch(FUNCTION_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },
              body: JSON.stringify({
                action: "report",
                latitude: lat,
                longitude: lng,
                accuracy: accuracy,
                consent: true
              })
            });

            const rawText = await response.text();
            let data;

            try {
              data = JSON.parse(rawText);
            } catch {
              throw new Error(
                "服务器返回的不是JSON：" + rawText.slice(0, 300)
              );
            }

            if (!response.ok || !data.success) {
              throw new Error(
                "HTTP状态：" + response.status +
                "\n错误：" + (data.error || "未知错误") +
                "\n详情：" + (data.details || "无") +
                "\n错误代码：" + (data.code || "无")
              );
            }

            result.textContent =
              "位置分享成功！感谢你的帮助。\n" +
              "纬度：" + lat + "\n" +
              "经度：" + lng + "\n" +
              "定位精度：" + Math.round(accuracy) + " 米\n" +
              "分享时间：" + new Date().toLocaleString("zh-CN");

          } catch (error) {
            result.textContent =
              "已经获取到位置，但上传失败。\n\n" +
              "纬度：" + lat + "\n" +
              "经度：" + lng + "\n\n" +
              "错误信息：\n" + error.message;
          } finally {
            button.disabled = false;
          }
        },
        function(error) {
          const messages = {
            1: "定位权限被拒绝，请检查浏览器的网站定位授权。",
            2: "设备暂时无法确定位置。",
            3: "定位超时，请重新尝试。"
          };

          result.textContent =
            "定位失败。\n" +
            "错误代码：" + error.code + "\n" +
            "错误原因：" +
            (messages[error.code] || error.message);

          button.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
